services:
  spark-master:
    image: docker.io/bitnamilegacy/spark:3.3.2
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      # Changed from 8080 to 9090 to avoid conflict with Keycloak which is now on 8080
      - '9090:8080'
      - '7077:7077'
      - '4040:4040'
    volumes:
      - ./apps:/apps
    networks:
      - shared_network_local
    restart: unless-stopped

  spark-worker1:
    image: docker.io/bitnamilegacy/spark:3.3.2
    container_name: spark-worker1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./apps:/apps
    networks:
      - shared_network_local
    restart: unless-stopped
    depends_on:
      - spark-master

  spark-worker2:
    image: docker.io/bitnamilegacy/spark:3.3.2
    container_name: spark-worker2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./apps:/apps
    networks:
      - shared_network_local
    restart: unless-stopped
    depends_on:
      - spark-master

networks:
  shared_network_local:
    external: true
